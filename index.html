<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Accessible Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="addTabFocus()">

    <h1>Accessible Photo Gallery</h1>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery">

        <img class="preview" src="https://picsum.photos/id/1015/300/200" alt="Mountain Landscape"
            onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">

        <img class="preview" src="https://picsum.photos/id/1025/300/200" alt="Cute Dog" onmouseover="upDate(this)"
            onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">

        <img class="preview" src="https://picsum.photos/id/1035/300/200" alt="Green Forest" onmouseover="upDate(this)"
            onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">

        <img class="preview" src="https://picsum.photos/id/1043/300/200" alt="Ocean View" onmouseover="upDate(this)"
            onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">

        <img class="preview" src="https://picsum.photos/id/1050/300/200" alt="Snowy Mountain" onmouseover="upDate(this)"
            onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">

        <img class="preview" src="https://picsum.photos/id/1069/300/200" alt="Beautiful Flowers"
            onmouseover="upDate(this)" onmouseleave="undo()" onfocus="upDate(this)" onblur="undo()">

    </div>

    <script src="script.js"></script>

</body>

</html>
