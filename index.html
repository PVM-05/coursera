<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <img class="preview" src="https://picsum.photos/id/1015/300/200" alt="Mountain Landscape" onmouseover="upDate(this)"
        onmouseout="undo()">

    <img class="preview" src="https://picsum.photos/id/1025/300/200" alt="Cute Dog" onmouseover="upDate(this)"
        onmouseout="undo()">

    <img class="preview" src="https://picsum.photos/id/1035/300/200" alt="Beautiful Forest" onmouseover="upDate(this)"
        onmouseout="undo()">

    <img class="preview" src="https://picsum.photos/id/1043/300/200" alt="Ocean View" onmouseover="upDate(this)"
        onmouseout="undo()">

    <script src="script.js"></script>

</body>

</html>
